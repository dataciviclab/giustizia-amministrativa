name: check

on:
  pull_request:
    paths:
      - "datasets/**"
      - "compose/**"
      - "dashboard/**"
      - "registry/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.sql"
      - "**/Makefile"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      count: ${{ steps.detect.outputs.count }}
      found: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/detect-changed-datasets@main
        id: detect
        with:
          paths: "datasets compose"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-config:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -e .\"[dev]\""
      configs: ${{ needs.detect.outputs.dirs }}
      years: "from-config"

  # Smoke dashboard: solo stdlib + pytest (py_compile/ast/registry.json).
  # Non richiede streamlit — gira anche sulle PR senza dati clean.
  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Dashboard smoke + registry contract
        run: python -m pytest dashboard/tests -q
