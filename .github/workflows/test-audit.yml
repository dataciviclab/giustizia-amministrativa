name: test-audit

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
  pull_request:
    paths:
      - "**/*.py"

permissions:
  contents: read

jobs:
  audit-markers:
    uses: dataciviclab/.github/.github/workflows/test-audit-reusable.yml@main
    with:
      test-dirs: "tests"
      extra-packages: "pytest pyyaml"
