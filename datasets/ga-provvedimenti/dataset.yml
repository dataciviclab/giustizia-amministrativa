root: ../../out
schema_version: 1

dataset:
  name: ga_provvedimenti
  source_id: openga
  tags: [giustizia, giustizia-amministrativa, contenzioso]
  category: giustizia
  years:
  - 2026
  time_coverage:
    start_year: 2017
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
  - name: openga
    type: script
    args:
      command: "python ../../prefetch.py raw_input.csv --type provvedimenti"
      output: raw_input.csv
      filename: raw_input.csv
    primary: true

clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - mese
  - codice_sede
  - nome_sede
  - tipo_provvedimento
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno
    - totale_provvedimenti

mart:
  tables:
  - name: mart_produttivita_sede
    sql: sql/mart_sede.sql
  - name: mart_trend
    sql: sql/mart_trend.sql
  required_tables:
  - mart_produttivita_sede
  validate:
    table_rules:
      mart_produttivita_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - totale_provvedimenti
          - provvedimenti_definiscono
          - provvedimenti_non_definiscono
        primary_key: [anno, codice_sede, nome_sede]
        min_rows: 5
      mart_trend:
        required_columns:
          - anno
          - totale_provvedimenti
          - definiscono_pct
        primary_key: [anno]
        min_rows: 1

validation:
  fail_on_error: true
