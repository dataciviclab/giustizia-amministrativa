root: ../../out
schema_version: 1

dataset:
  name: ga_ricorsi_definiti
  source_id: openga
  tags: [giustizia, giustizia-amministrativa, contenzioso]
  category: giustizia
  years:
  - 2026
  time_coverage:
    start_year: 2017
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
  - name: openga
    type: script
    args:
      command: "python ../../prefetch.py raw_input.csv --type ricorsi-definiti"
      output: raw_input.csv
      filename: raw_input.csv
    primary: true

clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - codice_sede
  - nome_sede
  - classificazione_ricorso
  - esito_provvedimento
  - numero_ricorsi_definiti
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno_sentenza
    - numero_ricorsi_definiti

mart:
  tables:
  - name: mart_definiti_per_sede
    sql: sql/mart_sede.sql
  - name: mart_definiti_per_tipo
    sql: sql/mart_tipo.sql
  required_tables:
  - mart_definiti_per_sede
  validate:
    table_rules:
      mart_definiti_per_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - esito_provvedimento
          - totale
        primary_key: [anno, codice_sede, nome_sede, esito_provvedimento]
        min_rows: 5
      mart_definiti_per_tipo:
        required_columns:
          - anno
          - classificazione_ricorso
          - esito_provvedimento
          - totale
        primary_key: [anno, classificazione_ricorso, esito_provvedimento]
        min_rows: 5

validation:
  fail_on_error: true
