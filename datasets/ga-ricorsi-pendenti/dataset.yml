root: ../../out
schema_version: 1

dataset:
  name: ga_ricorsi_pendenti
  source_id: openga
  tags: [giustizia, giustizia-amministrativa, contenzioso, pendenti, stock]
  category: giustizia
  description: "Stock mensile dei ricorsi pendenti in giudizio presso le sedi della Giustizia Amministrativa (CdS, CGA Sicilia, TAR, TRGA), per sede e periodo. Fonte OpenGA."
  years:
  - 2026
  time_coverage:
    start_year: 2020
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
  - name: openga
    type: script
    args:
      command: "python ../../prefetch.py raw_input.csv --type ricorsi-pendenti"
      output: raw_input.csv
      filename: raw_input.csv
    primary: true

clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - mese
  - codice_sede
  - nome_sede
  - numero_ricorsi_pendenti
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno
    - mese
    - numero_ricorsi_pendenti

mart:
  tables:
  - name: mart_pendenti_per_sede
    sql: sql/mart_sede.sql
  - name: mart_pendenti_nazionale
    sql: sql/mart_nazionale.sql
  required_tables:
  - mart_pendenti_per_sede
  - mart_pendenti_nazionale
  validate:
    table_rules:
      mart_pendenti_per_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - n_mesi
          - pendenti_media
        primary_key: [anno, codice_sede]
        min_rows: 5
      mart_pendenti_nazionale:
        required_columns:
          - anno
          - n_mesi
          - pendenti_media
        primary_key: [anno]
        min_rows: 5

validation:
  fail_on_error: true
