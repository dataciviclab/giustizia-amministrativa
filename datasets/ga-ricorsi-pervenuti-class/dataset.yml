clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - anno_mese
  - codice_sede
  - nome_sede
  - classificazione_ricorso
  - numero_ricorsi
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno
    - numero_ricorsi

mart:
  tables:
  - name: mart_pervenuti_per_sede
    sql: sql/mart_sede.sql
  - name: mart_pervenuti_per_tipo
    sql: sql/mart_tipo.sql
  required_tables:
  - mart_pervenuti_per_sede
  validate:
    table_rules:
      mart_pervenuti_per_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - totale
        primary_key: [anno, codice_sede, nome_sede]
        min_rows: 5
      mart_pervenuti_per_tipo:
        required_columns:
          - anno
          - classificazione_ricorso
          - totale
        primary_key: [anno, classificazione_ricorso]
        min_rows: 5

validation:
  fail_on_error: true
