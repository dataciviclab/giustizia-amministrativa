clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - mese
  - codice_sede
  - nome_sede
  - totale_definiti
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno
    - totale_definiti

mart:
  tables:
  - name: mart_mezzi_sede
    sql: sql/mart_sede.sql
  - name: mart_trend
    sql: sql/mart_trend.sql
  required_tables:
  - mart_mezzi_sede
  validate:
    table_rules:
      mart_mezzi_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - definiti_sentenza_breve
          - definiti_decreto_decisori
          - definiti_altri
          - totale_definiti
        primary_key: [anno, codice_sede, nome_sede]
        min_rows: 5
      mart_trend:
        required_columns:
          - anno
          - totale_definiti
          - sentenza_pct
        primary_key: [anno]
        min_rows: 1

validation:
  fail_on_error: true
