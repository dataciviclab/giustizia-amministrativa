clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - mese
  - codice_sede
  - nome_sede
  - classificazione_ricorso
  - tipo_sentenza
  - numero_sentenze
  sql: sql/clean.sql
  validate:
    min_rows: 100
    not_null:
    - anno
    - numero_sentenze

mart:
  tables:
  - name: mart_brevi_per_sede
    sql: sql/mart_sede.sql
  - name: mart_brevi_per_tipo
    sql: sql/mart_tipo.sql
  required_tables:
  - mart_brevi_per_sede
  validate:
    table_rules:
      mart_brevi_per_sede:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - tipo_sentenza
          - totale
        primary_key: [anno, codice_sede, nome_sede, tipo_sentenza]
        min_rows: 5
      mart_brevi_per_tipo:
        required_columns:
          - anno
          - classificazione_ricorso
          - tipo_sentenza
          - totale
        primary_key: [anno, classificazione_ricorso, tipo_sentenza]
        min_rows: 5

validation:
  fail_on_error: true
