root: ../../out
schema_version: 1

dataset:
  name: openga_ricorsi_appalto
  source_id: openga
  tags: [giustizia, giustizia-amministrativa, contenzioso]
  category: giustizia
  years:
  - 2026
  time_coverage:
    start_year: 2018
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
  - name: openga
    type: script
    args:
      command: "python ../../prefetch.py raw_input.csv"
      output: raw_input.csv
      filename: raw_input.csv
    primary: true

clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - codice_sede
  - nome_sede
  - classificazione_ricorso
  - provincia
  - codice_cig
  sql: sql/clean.sql
  validate:
    not_null: [anno]
    min_rows: 5
    max_null_pct:
      anno: 0.1
      numero_ricorso: 0.2
      data_deposito_ricorso: 0.2
      codice_cig: 0.3

mart:
  tables:
  - name: mart_ricorsi_sede_classificazione
    sql: sql/mart_sede_classificazione.sql
  - name: mart_ricorsi_territorio_settore
    sql: sql/mart_territorio_settore.sql
  required_tables:
  - mart_ricorsi_sede_classificazione
  validate:
    table_rules:
      mart_ricorsi_sede_classificazione:
        required_columns:
          - anno
          - codice_sede
          - nome_sede
          - classificazione_ricorso
          - totale_ricorsi
          - gare_distinte
        primary_key: [anno, codice_sede, nome_sede, classificazione_ricorso]
        not_null:
          - anno
          - codice_sede
          - totale_ricorsi
        min_rows: 5
      mart_ricorsi_territorio_settore:
        required_columns:
          - anno
          - provincia
          - settore
          - totale_ricorsi
          - gare_distinte
        primary_key: [anno, provincia, settore]
        not_null:
          - anno
          - provincia
          - totale_ricorsi
        min_rows: 0

validation:
  fail_on_error: true
