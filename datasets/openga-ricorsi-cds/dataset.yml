root: ../../out
schema_version: 1

dataset:
  name: "openga_ricorsi_cds"
  source_id: "openga"
  tags: [giustizia, giustizia-amministrativa, contenzioso]
  category: giustizia
  years:
  - 2026
  time_coverage:
    start_year: 2023
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
  - name: openga
    type: script
    args:
      command: "python ../../prefetch.py raw_input.csv --type ricorsi-pendenti"
      output: raw_input.csv
      filename: raw_input.csv
    primary: true

clean:
  read:
    source: auto
    mode: all
    delim: ","
    encoding: utf-8
    header: true
  required_columns:
  - anno
  - anno_mese_riferimento
  - mese
  - codice_sede
  - nome_sede
  - numero_ricorsi_pendenti
  sql: sql/clean.sql
  validate:
    min_rows: 10
    not_null:
    - codice_sede
    - nome_sede
    - numero_ricorsi_pendenti

mart:
  tables:
  - name: ricorsi_annuali
    sql: sql/mart_annuale.sql
  required_tables:
  - ricorsi_annuali
  validate:
    table_rules:
      ricorsi_annuali:
        primary_key: [anno, codice_sede, nome_sede]
        min_rows: 1
