[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-giustizia-amministrativa"
version = "0.1.0"
description = "Giustizia amministrativa italiana — dati e analisi"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Catalog engine per-repo (probe, inventory, source report).
# Tag stabili: https://github.com/dataciviclab/source-observatory/tags
observatory = [
    "dataciviclab-source-observatory[validate] @ git+https://github.com/dataciviclab/source-observatory.git@main",
]

[project.urls]
Home = "https://github.com/dataciviclab/giustizia-amministrativa"

[tool.toolkit.extends]
source_id = "giustizia-amministrativa"

[tool.observatory]
source_id = "openga"
protocol = "ckan"
base_url = "https://openga.giustizia-amministrativa.it/api/3/action/package_list?limit=1"
observation_mode = "catalog-watch"
verdict = "go"
note = "CKAN Giustizia Amministrativa: 436 package = 14 temi giuridici x 31 sedi + 2 pareri (consultive), piu' i calendari udienze (fuori perimetro). Copertura del repo: 11 temi su 15 (312 package su 436). Mancano provvedimenti-pubblicati-per-classificazione-ed-esito (issue #11), ricorsi-pervenuti-per-tipologia e ricorsi-per-tipologia-di-provvedimento (issue #12); calendario-udienze escluso per scelta. Items nel catalog = bacino monitorato, non quota usata: drift utile = package di un tema coperto che sparisce."
