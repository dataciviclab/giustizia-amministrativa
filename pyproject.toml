[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-giustizia-amministrativa"
version = "0.1.0"
description = "Giustizia amministrativa italiana — dati e analisi"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Catalog engine per-repo (probe, inventory, source report).
# Tag stabili: https://github.com/dataciviclab/source-observatory/tags
observatory = [
    "dataciviclab-source-observatory[validate] @ git+https://github.com/dataciviclab/source-observatory.git@main",
]

[project.urls]
Home = "https://github.com/dataciviclab/giustizia-amministrativa"

[tool.toolkit.extends]
source_id = "giustizia-amministrativa"

[tool.observatory]
source_id = "openga"
protocol = "ckan"
base_url = "https://openga.giustizia-amministrativa.it/api/3/action/package_list?limit=1"
observation_mode = "catalog-watch"
verdict = "go"
note = "CKAN Giustizia Amministrativa. Il portale e' 10 temi giuridici x ~40 corti/distretti (~400 package) + calendari udienze (~60, non nostri). I nostri 12 dataset curati coprono il 100% dei temi giuridici: items nel catalog = bacino monitorato, non quota usata. Drift utile = package dei nostri temi che spariscono."
